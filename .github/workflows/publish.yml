name: Build and publish china_5a

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        run: |
          python download_wikidata.py --logging=DEBUG

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/website

  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4


